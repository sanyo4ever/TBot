name: Fork CI and release

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: 'Fork prerelease version, for example 3.4.7-sanyo.1'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: fork-build-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      assembly: ${{ steps.version.outputs.assembly }}
    steps:
      - name: Validate version and release branch
        id: version
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        shell: bash
        run: |
          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch ]]; then
            if [[ "$GITHUB_REF" != refs/heads/main ]]; then
              echo '::error::Release builds must run from main.'
              exit 1
            fi
            if [[ ! "$REQUESTED_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+-sanyo\.[0-9]+$ ]]; then
              echo '::error::Use a fork version such as 3.4.7-sanyo.1.'
              exit 1
            fi
            version="$REQUESTED_VERSION"
          else
            version="3.4.7-sanyo.0-ci.${GITHUB_RUN_NUMBER}"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "assembly=${version%%-*}" >> "$GITHUB_OUTPUT"

  test:
    needs: version
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: '0'
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - uses: actions/setup-go@v7
        with:
          go-version-file: ogame/go.mod
          cache-dependency-path: ogame/go.sum
      - name: C# regression tests
        run: dotnet test TBot.sln -c Release
      - name: Go regression tests and build
        working-directory: ogame
        run: |
          go test -count=1 ./...
          go build ./...

  package:
    needs: [version, test]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - {platform: win64, rid: win-x64, goos: windows, goarch: amd64, goarm: '', backend: ogamed.exe}
          - {platform: win32, rid: win-x86, goos: windows, goarch: '386', goarm: '', backend: ogamed.exe}
          - {platform: linux64, rid: linux-x64, goos: linux, goarch: amd64, goarm: '', backend: ogamed}
          - {platform: linuxarm, rid: linux-arm, goos: linux, goarch: arm, goarm: '7', backend: ogamed}
          - {platform: linuxarm64, rid: linux-arm64, goos: linux, goarch: arm64, goarm: '', backend: ogamed}
          - {platform: osx64, rid: osx-x64, goos: darwin, goarch: amd64, goarm: '', backend: ogamed}
          - {platform: osx-arm64, rid: osx-arm64, goos: darwin, goarch: arm64, goarm: '', backend: ogamed}
    env:
      VERSION: ${{ needs.version.outputs.version }}
      ASSEMBLY_VERSION: ${{ needs.version.outputs.assembly }}
      PLATFORM: ${{ matrix.platform }}
      RID: ${{ matrix.rid }}
      CGO_ENABLED: '0'
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - uses: actions/setup-go@v7
        with:
          go-version-file: ogame/go.mod
          cache-dependency-path: ogame/go.sum
      - name: Publish self-contained TBot
        shell: bash
        run: |
          dotnet publish TBot -c Release -r "$RID" -o "publish/$PLATFORM" \
            -p:Version="$VERSION" -p:AssemblyVersion="$ASSEMBLY_VERSION" \
            -p:FileVersion="$ASSEMBLY_VERSION" -p:InformationalVersion="$VERSION" \
            -p:PublishSingleFile=true --self-contained true
      - name: Build pinned ogamed-tbot
        working-directory: ogame
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          GOARM: ${{ matrix.goarm }}
          BACKEND: ${{ matrix.backend }}
        shell: bash
        run: go build -trimpath -o "../publish/$PLATFORM/$BACKEND" ./cmd/ogamed-tbot
      - name: Package with source provenance
        shell: bash
        run: |
          cp README.md "publish/$PLATFORM/"
          cp ogame/LICENSE "publish/$PLATFORM/OGAME-LICENSE"
          {
            echo "Version: $VERSION"
            echo "Repository: $GITHUB_REPOSITORY"
            echo "TBot commit: $GITHUB_SHA"
            echo "Go commit: $(git -C ogame rev-parse HEAD)"
            echo "Platform: $RID"
            echo ".NET SDK: $(dotnet --version)"
            go version
          } > "publish/$PLATFORM/BUILD-INFO.txt"
          if [[ "$PLATFORM" != win* ]]; then
            chmod +x "publish/$PLATFORM/TBot" "publish/$PLATFORM/ogamed"
          fi
          zip -q -r "TBot-$VERSION-$PLATFORM.zip" "publish/$PLATFORM/"
      - uses: actions/upload-artifact@v7
        with:
          name: TBot-${{ env.VERSION }}-${{ matrix.platform }}
          path: TBot-${{ env.VERSION }}-${{ matrix.platform }}.zip
          compression-level: 0
          if-no-files-found: error
          retention-days: 14

  draft-release:
    if: github.event_name == 'workflow_dispatch'
    needs: [version, package]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: TBot-*
          path: dist
          merge-multiple: true
      - name: Verify package count and checksums
        shell: bash
        run: |
          packages=(dist/TBot-*.zip)
          [[ ${#packages[@]} -eq 7 ]] || { echo '::error::Expected seven release packages.'; exit 1; }
          (cd dist && sha256sum TBot-*.zip > SHA256SUMS)
          cat > release-notes.md <<EOF
          Independent sanyo4ever maintenance fork of TBot.

          Source: https://github.com/$GITHUB_REPOSITORY/commit/$GITHUB_SHA
          Each package includes BUILD-INFO.txt with the exact TBot and Go commits.
          These automated builds do not constitute a live-account fleet-send test.
          EOF
      - name: Create fork draft prerelease
        shell: bash
        run: |
          # Atomically reserve a new tag at the built commit; existing tags fail.
          gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
            -f "ref=refs/tags/sanyo-v$VERSION" -f "sha=$GITHUB_SHA"
          gh release create "sanyo-v$VERSION" dist/TBot-*.zip dist/SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "TBot $VERSION" --notes-file release-notes.md --draft --prerelease
